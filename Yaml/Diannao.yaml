# 机场订阅
proxy-providers:
  良心:
    url: "https://"
    type: http
    interval: 9986400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连
    benchmark-url: https://www.gstatic.com/generate_204
    override:
      additional-prefix: "[良心] "
  EZ:
    url: "https://"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连
    benchmark-url: https://www.gstatic.com/generate_204
    override:
      additional-prefix: "[EZ] " 
  琴鸟:
    url: "http://"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连
    benchmark-url: https://www.gstatic.com/generate_204
    override:
      additional-prefix: "[琴鸟] "  

  GLA:
    url: "https://"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连
    benchmark-url: https://www.gstatic.com/generate_204
    override:
      additional-prefix: "[GLA] "


# 节点信息
proxies:
  - {name: 直连, type: direct}
# 全局配置 
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'off'
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true
# 控制面板
external-controller: 0.0.0.0:9090
secret: ""
external-ui: "/etc/mihomo/run/ui"
external-ui-name: zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"
# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "+.baidu.com"
# 入站  
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
# DNS模块
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:private_domain,cn_domain"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
  default-nameserver:
    - 223.5.5.5
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
# 出站策略
pr: &pr {type: select, proxies: [随心所欲, 香港自动, 香港故转, 香港节点, 日本自动, 日本故转, 日本节点, 狮城自动, 狮城故转, 狮城节点, 美国自动, 台湾故转, 美国节点, 韩国自动, 韩国故转, 韩国节点, 综合节点, 自动选择,  直连]} # 漏网之鱼
aq: &aq {type: select, proxies: [台湾自动,随心所欲, 日本自动, 狮城自动, 美国自动, 指尖逸选, 直连, 香港自动,]} # 人工智能 & 全球语桥
aw: &aw {type: select, proxies: [直连, 美国节点, 香港节点, 指尖逸选]} # 果园私语
ae: &ae {type: select, proxies: [直连, 随心所欲]} # 绝对通行
ar: &ar {type: select, proxies: [美国自动, 美国故转, 美国节点, 直连, 指尖逸选]} # Chatgpt
at: &at {type: select, include-all: true, filter: '^(?!.*(直连|港|台|新|日|韩|香港|台湾|新加坡|日本|韩国|美国|英国|德国|荷兰|意大利|法国|🇭🇰|🇼🇸|🇹🇼|🇸🇬|🇯🇵|🇰🇷|🇺🇸|🇬🇧|🇩🇪|🇳🇱|🇮🇹|🇫🇷|(?i)HongKong|Taiwan|Singapore|Japan|Korea|America|States|USA|UK|Britain|Germany|Netherlands|Italy|France|London|HK|TW|SG|JP|KR|US|CDG|FRA|AMS|MAD|BCN|FCO|MUC|BRU|HKG|TPE|TSA|KHH|SIN|XSP|NRT|HND|KIX|CTS|FUK|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD|LHR|LGW)).*$'}
av: &av {type: select, proxies: [日本自动, 日本故转, 日本节点, 直连, 指尖逸选]} # 秘密花园
ay: &ay {type: select, proxies: [雪落无声, 直连, 指尖逸选]} # 影库狂潮
pt: &pt {type: select, proxies: [随心所欲, 香港故转, 日本故转, 香港自动, 日本自动, 美国自动, 自动选择, 指尖逸选, 香港节点, 日本节点, 美国节点, 直连]} # 兰台共储
mm: &mm {type: select, proxies: [香港自动,自动选择, 香港故转, 香港节点,  日本故转, 日本节点, 日本自动, 狮城故转, 狮城节点, 狮城自动, 台湾故转, 台湾节点, 台湾自动, 美国故转, 美国节点, 美国自动, 指尖逸选, 直连]} # 随心所欲
ad: &ad {type: select, include-all: true} # 指尖逸选


