# 机场订阅
proxy-providers:
  良心:
    url: "XXXXXXX"
    type: http
    interval: 9986400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连
    benchmark-url: https://www.gstatic.com/generate_204
    override:
      additional-prefix: "[良心] "

# 节点信息
proxies:
  - {name: 直连, type: direct}
# 全局配置 
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'off'
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true
# 控制面板
external-controller: 0.0.0.0:9090
secret: ""
external-ui: "/etc/mihomo/run/ui"
external-ui-name: zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"
# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "+.baidu.com"
# 入站  
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
# DNS模块
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:private_domain,cn_domain"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
  default-nameserver:
    - 223.5.5.5
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
# 出站策略
pr: &pr {type: select, proxies: [🚀 默认代理, ♻️ 香港自动, 🔯 香港故转, 🇭🇰 香港节点, ♻️ 日本自动, 🔯 日本故转, 🇯🇵 日本节点, ♻️ 狮城自动, 🔯 狮城故转, 🇸🇬 狮城节点, ♻️ 美国自动, 🔯 台湾故转, 🇺🇸 美国节点, ♻️ 自动选择,  直连]}
aq: &aq {type: select, proxies: [ ♻️ 日本自动, ♻️ 狮城自动, ♻️ 美国自动, ✋ 手动选择, 直连, 🚀 默认代理, ♻️ 香港自动,]}
aw: &aw {type: select, proxies: [直连, 🇺🇸 美国节点, 🇭🇰 香港节点, ✋ 手动选择]}
ae: &ae {type: select, proxies: [直连, 🚀 默认代理]}
ar: &ar {type: select, proxies: [♻️ 美国自动, 🔯 美国故转, 🇺🇸 美国节点, 直连, ✋ 手动选择]}
at: &at {type: select, include-all: true, filter: '^(?!.*(直连|港|台|新|日|韩|香港|台湾|新加坡|日本|韩国|美国|🇭🇰|🇼🇸|🇹🇼|🇸🇬|🇯🇵|🇰🇷|🇺🇸|🇬🇧|🇦🇹|🇧🇪|🇨🇿|🇩🇰|🇫🇮|🇫🇷|🇩🇪|🇮🇪|🇮🇹|🇱🇹|🇱🇺|🇳🇱|🇵🇱|🇸🇪|HK|TW|SG|JP|KR|US|GB|CDG|FRA|AMS|MAD|BCN|FCO|MUC|BRU|HKG|TPE|TSA|KHH|SIN|XSP|NRT|HND|KIX|CTS|FUK|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD|LHR|LGW))'}
av: &av {type: select, proxies: [♻️ 日本自动, 🔯 日本故转, 🇯🇵 日本节点, 直连, ✋ 手动选择]}
ay: &ay {type: select, proxies: [❄️ 冷门节点, 直连, ✋ 手动选择]}
pt: &pt {type: select, proxies: [🚀 默认代理, 🔯 香港故转, 🔯 日本故转, ♻️ 香港自动, ♻️ 日本自动, ♻️ 美国自动, ♻️ 自动选择, ✋ 手动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇸 美国节点, 直连]}
mm: &mm {type: select, proxies: [♻️ 香港自动, 🔯 香港故转, 🇭🇰 香港节点, ♻️ 自动选择, 🔯 日本故转, 🇯🇵 日本节点, ♻️ 日本自动, 🔯 狮城故转, 🇸🇬 狮城节点, ♻️ 狮城自动, 🔯 台湾故转, 🏍️ 台湾节点, ♻️ 台湾自动, 🔯 美国故转, 🇺🇸 美国节点, ♻️ 美国自动, ✋ 手动选择, 直连]}
ad: &ad {type: select, include-all: true}


proxy-groups:
  - {name: 🚀 默认代理, !!merge <<: *mm}
  - {name: ✋ 手动选择, !!merge <<: *ad}
  - {name: 📥 PT下载, !!merge <<: *pt}
  - {name: 🎬 Emby库, !!merge <<: *ay}
  - {name: 🔞 DMM.R18, !!merge <<: *av}
  - {name: ❄️ 冷门节点, !!merge <<: *at}
  - {name: 🤖 Chatgpt, !!merge <<: *ar}
  - {name: 🤯 人工智能, !!merge <<: *aq}
  - {name: 📽️ 油管视频, !!merge <<: *aq}
  - {name: 🍀 谷歌地球, !!merge <<: *aq}
  - {name: 🪟 微软邮箱, !!merge <<: *aq}
  - {name: 👨🏿‍💻 Git Hub, !!merge <<: *aq}
  - {name: 🎵 国外抖音, !!merge <<: *aq}
  - {name: 📲 电报消息, !!merge <<: *aq}
  - {name: ✈️ 网速测试, !!merge <<: *aq}
  - {name: 💶 货币平台, !!merge <<: *aq}
  - {name: 🍎 苹果商店, !!merge <<: *aw}
  - {name: 🎯 直连, !!merge <<: *ae}
  - {name: 🐟 漏网之鱼, !!merge <<: *pr}
  - {name: ♻️ 香港自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(港|HK|(?i)Hong|HKG|香港|🇭🇰))^((?!(台|日|韩|新|深|美|hongxin)).)*$"}
  - {name: ♻️ 自动选择, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(直连)).)*$"}
  - {name: ♻️ 日本自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(日|JP\\b|(?i)Japan|NRT|HND|KIX|CTS|FUK|🇯🇵))^((?!(港|台|韩|新|深|美)).)*$"}
  - {name: ♻️ 狮城自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(狮城|新加坡|(?i)Singapore|SG\\b|SGP|SIN|XSP|🇸🇬))^((?!(港|台|日|韩|美|美利坚|USA|Japan|JP|韩国|香港|台湾)).)*$"}
  - {name: ♻️ 台湾自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(台|TW\\b|Taiwan|TPE|KHH|TSA|🇹🇼))^((?!(港|日|韩|新|美)).)*$"}
  - {name: ♻️ 美国自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(美|US\\b|(?i)States|USA|United\\s*States|American|JFK|LAX|SFO|🇺🇸))^((?!(港|台|日|韩|新)).)*$"} 
  - {name: 🔯 香港故转, type: fallback, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$"}
  - {name: 🔯 日本故转, type: fallback, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$"}
  - {name: 🔯 狮城故转, type: fallback, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(狮城|新加坡|(?i)Singapore|SG\\b|SGP))^((?!(港|台|日|韩|美|美利坚|USA|Japan|JP|韩国|香港|台湾)).)*$"}
  - {name: 🔯 美国故转, type: fallback, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(美|US|(?i)United\\s?States|USA|American))^((?!(港|台|韩|新|日|狮)).)*$"}
  - {name: 🔯 台湾故转, type: fallback, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(台|TW|Taiwan|TPE|KHH|TSA))^((?!(港|日|韩|新|美)).)*$"}
  - {name: 🇭🇰 香港节点, type: select, include-all: true, filter: "(?i)港|香港|HK|HKG|hong\\s*kong|xianggang|heung\\s*gong|🇭🇰"}
  - {name: 🇯🇵 日本节点, type: select, include-all: true, filter: "(?i)日本|日|JP\\b|Japan|NRT|HND|KIX|CTS|FUK|🇯🇵|nihon|nippon"}
  - {name: 🇸🇬 狮城节点, type: select, include-all: true, filter: "(?i)狮城|新加坡|SG\\b|Sing|Singapore|SIN|XSP|xinjiapo|🇸🇬"}
  - {name: 🏍️ 台湾节点, type: select, include-all: true, filter: "(?i)台湾|台灣|台|TW\\b|TPE|TSA|KHH|taiwan|tai\\s*wan|🇹🇼"}
  - {name: 🇺🇸 美国节点, type: select, include-all: true, filter: "(?i)美国|美|US\\b|USA\\b|United\\s*States|UnitedStates|America|American|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD|🇺🇸|mei\\s*guo"}
