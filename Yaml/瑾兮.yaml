  - DOMAIN-SUFFIX,bittorrent.com,直连
  - DOMAIN-SUFFIX,bttrack.com,直连
  - DOMAIN-SUFFIX,tracker,直连
  # BitTorrent 常见端口范围
  - SRC-PORT,34560-34570,直连
  - SRC-PORT,8080,直连
  # Cloudflare
  - DOMAIN-SUFFIX,cloudflare.com,直连
