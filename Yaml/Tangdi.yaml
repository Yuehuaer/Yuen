# 机场订阅
proxy-providers:
  琴鸟:
    url: "http://38.59.246.49:38295/bfg3ubif/7a6bbdcc0cc29d1b63b805317e4dffb5"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连
    benchmark-url: https://www.gstatic.com/generate_204
    override:
      additional-prefix: "[琴鸟] "
  良心:
    url: "https://liangxin.xyz/api/v1/liangxin?OwO=5fdc22b633bbc27203b0965dfbc0e5b3"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连
    benchmark-url: https://www.gstatic.com/generate_204
    override:
      additional-prefix: "[良心] "
# 节点信息
proxies:
  - {name: 直连, type: direct}
# 全局配置 
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'off'
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true
# 控制面板
external-controller: 0.0.0.0:9090
secret: ""
external-ui: "/etc/mihomo/run/ui"
external-ui-name: zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"
# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "+.baidu.com"
# 入站  
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
# DNS模块
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:private_domain,cn_domain"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
  default-nameserver:
    - 223.5.5.5
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
rule-anchor:
  # 锚点 - 规则集
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs} # IP规则集
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs} # 域名规则集
  class: &class {type: http, interval: 86400, behavior: classical, format: text} # 经典规则集
  # 锚点 - 筛选组
  FilterHK: &FilterHK '(?i)港|香港|HK|HKG|hong\\s*kong|xianggang|heung\\s*gong|🇭🇰' # 香港筛选
  FilterJP: &FilterJP '(?i)日本|日|JP\\b|Japan|NRT|HND|KIX|CTS|FUK|🇯🇵|nihon|nippon' # 日本筛选
  FilterSG: &FilterSG '(?i)狮城|新加坡|SG\\b|Sing|Singapore|SIN|XSP|xinjiapo|🇸🇬' # 新加坡筛选
  FilterKR: &FilterKR '(?i)韩|韩国|🇰🇷|韓|韓國|首尔|南朝鲜|KR|KOR|Korea|South'
  FilterEU: &FilterEU '(?i)(🇧🇪|🇨🇿|🇩🇰|🇫🇮|🇫🇷|🇩🇪|🇮🇪|🇮🇹|🇱🇹|🇱🇺|🇳🇱|🇵🇱|🇸🇪|🇬🇧|CDG|FRA|AMS|MAD|BCN|FCO|MUC|BRU)'
  FilterTW: &FilterTW '(?i)台湾|台灣|台|TW\\b|TPE|TSA|KHH|taiwan|tai\\s*wan|🇹🇼' # 台湾筛选
  FilterUS: &FilterUS '(?i)美国|美|US\\b|USA\\b|United\\s*States|America|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD|🇺🇸' # 美国筛选
  FilterZH: &FilterZH '^(?!.*(港|香港|HK|HKG|hong\\s*kong|xianggang|heung\\s*gong|🇭🇰|日本|日|JP\\b|Japan|NRT|HND|KIX|CTS|FUK|🇯🇵|nihon|nippon|狮城|新加坡|SG\\b|Sing|Singapore|SIN|XSP|xinjiapo|🇸🇬|美国|美|US\\b|USA\\b|United\\s*States|America|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD|🇺🇸|台湾|台灣|台|TW\\b|TPE|TSA|KHH|taiwan|Taiwan|tai\\s*wan|🇹🇼))'
  FilterOther: &FilterOther '^(?!.*(直连|港|台|新|日|韩|香港|台湾|新加坡|日本|韩国|美国|🇭🇰|🇼🇸|🇹🇼|🇸🇬|🇯🇵|🇰🇷|🇺🇸|🇬🇧|🇧🇪|🇨🇿|🇩🇰|🇫🇮|🇫🇷|🇩🇪|🇮🇪|🇮🇹|🇱🇳|🇳🇱|🇵🇱|🇸🇪|HK|TW|SG|JP|KR|US|GB|CDG|FRA|AMS|MAD|BCN|FCO|MUC|BRU|HKG|TPE|TSA|KHH|SIN|XSP|NRT|HND|KIX|CTS|FUK|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD))' # 冷门节点筛选
  FilterAll: &FilterAll '^(?!.*(直连|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author))'
  FilterSmart: &FilterSmart '(?i)(港|香港|HK|HKG|hong\\s*kong|xianggang|heung\\s*gong|🇭🇰|日本|日|JP\\b|Japan|NRT|HND|KIX|CTS|FUK|🇯🇵|nihon|nippon|狮城|新加坡|SG\\b|Sing|Singapore|SIN|XSP|xinjiapo|🇸🇬)' # 智能优选筛选（香港、日本、新加坡）
  # 锚点 - 策略组
  UrlTest: &UrlTest {type: url-test, include-all: true, interval: 300, tolerance: 20, url: 'https://www.gstatic.com/generate_204'} # 通用测速策略
  FallBack: &FallBack {type: fallback, interval: 60, lazy: true, url: 'https://www.gstatic.com/generate_204', disable-udp: false, timeout: 2000, max-failed-times: 3, hidden: false}
  LoadBalanceCH: &LoadBalanceCH {type: load-balance, interval: 60, lazy: true, url: 'https://www.gstatic.com/generate_204', disable-udp: false, strategy: consistent-hashing, timeout: 2000, max-failed-times: 3, hidden: true, include-all: true}
  LoadBalanceCR: &LoadBalanceCR {type: load-balance, interval: 60, lazy: true, url: 'https://www.gstatic.com/generate_204', disable-udp: false, strategy: round-robin, timeout: 2000, max-failed-times: 3, hidden: true, include-all: true}
  SmartGroup: &SmartGroup {type: smart, include-all: true, filter: *FilterSmart, policy-priority: "HK:1.3;JP:1.2;SG:1.1", uselightgbm: false, collectdata: false, strategy: sticky-sessions, interval: 300, url: 'https://www.gstatic.com/generate_204', timeout: 2000, max-failed-times: 3} # 智能优选策略
  # 锚点 - 选择组 
  MM: &MM {type: select, proxies: [香港策略, 日本策略,台湾策略,狮城策略,韩国策略, 美国策略,指尖逸选,故障转移,雪落无声,链式代理, 直连]}
  SD: &SD {type: select, include-all: true} # 指尖逸选
  PT: &PT {type: select, proxies: [随心所欲,指尖逸选, 香港策略, 日本策略,狮城策略, 美国策略, 故障转移, 直连]} # 兰台共储
  Em: &Em {type: select, proxies: [雪落无声,  指尖逸选,直连]} # 影库狂潮
  AV: &AV {type: select, proxies: [日本策略, 指尖逸选,直连]} # 秘密花园
  LM: &LM {type: select, include-all: true, filter: *FilterOther} # 雪落无声
  MG: &MG {type: select, proxies: [台湾策略,狮城策略,美国策略, 指尖逸选, 直连]} # 程序怼王
  RG: &RG {type: select, proxies: [日本策略,狮城策略,美国策略, 指尖逸选, 直连]} # 未来之瞳
  GG: &GG {type: select, proxies: [直连, 香港策略,美国策略,指尖逸选]} # 果园私语
  ZL: &ZL {type: select, proxies: [直连, 随心所欲]} # 绝对通行



