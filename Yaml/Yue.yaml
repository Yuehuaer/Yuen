# mihomo 配置 -------------------------------------------------------------------------------
# 配置作者：Yuehuaer
# 适用版本：所有使用 mihomo 核心的程序
# 更新时间：2026年6月16日
# 版本：1.0.2
# 版本内容与核心特性：
# 1. 架构极致精简：深度运用 YAML 锚点（Anchors）与别名复用技术，代码零冗余，极大提升后期维护效率。
# 2. 路由性能榨取：全量采用 .mrs（Meta Rule Set）二进制规则集，极速加载且占用极低 RAM，完美适配路由器环境。
# 3. 高可用容灾网络：采用双层节点策略（url-test 延迟优选 + fallback 可用性兜底），确保网络 24 小时全天候无感切换。
# 4. 极致场景分流：专为家庭局域网深度定制，对影库流媒体 (Emby)、PT/BT 下载（底层物理级规避）、AI 人工智能（引入台湾原生节点极速解锁）、苹果生态等进行精准隔离分流。
# 5. 面板视觉重构：引入体系化的 Emoji 命名，大一统合并冗余的海外常用服务至“全球语桥”，控制面板极度清爽直观。
# 6. 极速网页解析：高度优化的 Fake-IP 增强模式与精准的域名嗅探（Sniffer）黑白名单，实现无感秒开且不破坏本地智能家居与探测服务。
#--------------------------------------------------------------------------------------------
# 版本更新：
# 2026-03-12 更新日志：1. 添加了「自动选择」锚点，用于自动选择节点。
# 2026-03-30 更新日志：1. 优化了规则集的命名和分类，使其更清晰易懂。2.AI规则集更新为更全面的AI相关域名列表，提升了对AI服务的支持。
# 2026-04-07 更新日志：1. 删除失效的规则集。
# 2026-06-16 更新日志：1. 检查了分流，修复了馒头导致无法开启
# mihomo 配置--------------------------------------------------------------------------------



# 机场订阅
proxy-providers:
  良心:
    url: "XXXXXXX"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连
    benchmark-url: https://www.gstatic.com/generate_204
    override:
      additional-prefix: "[良心] "

# 节点信息
proxies:
  - {name: 直连, type: direct}
# 全局配置 
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'off'
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true
# 控制面板
external-controller: 0.0.0.0:9090
secret: ""
external-ui: "/etc/mihomo/run/ui"
external-ui-name: zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"
# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "+.baidu.com"
# 入站  
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
# DNS模块
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:private_domain,cn_domain"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
  default-nameserver:
    - 223.5.5.5
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
# 出站策略
pr: &pr {type: select, proxies: [💫 随心所欲, 🌟 香港自动, 🔯 香港故转, 🛳 香港节点, 🌸 日本自动, 🔯 日本故转, 🗾 日本节点, ☕ 狮城自动, 🔯 狮城故转, 🦁 狮城节点, 🌭 美国自动, 🔯 台湾故转, 🗽 美国节点, ⚡ 自动选择,  直连]}
aq: &aq {type: select, proxies: [🍍 台湾自动, 🌸 日本自动, ☕ 狮城自动, 🌭 美国自动, ⚜️ 指尖逸选, 直连, 💫 随心所欲, 🌟 香港自动,]}
ae: &ae {type: select, proxies: [直连, 💫 随心所欲]}
at: &at {type: select, include-all: true, filter: '^(?!.*(直连|港|台|新|日|香港|台湾|新加坡|日本|美国|🇭🇰|🇼🇸|🇹🇼|🇸🇬|🇯🇵|🇺🇸|🇬🇧|HK|TW|SG|JP|US|GB|HKG|TPE|TSA|KHH|SIN|XSP|NRT|HND|KIX|CTS|FUK|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD)).*$'}
av: &av {type: select, proxies: [🌸 日本自动, 🔯 日本故转, 🗾 日本节点, 直连, ⚜️ 指尖逸选]}
ay: &ay {type: select, proxies: [❄️ 雪落无声, 直连, ⚜️ 指尖逸选]}
pt: &pt {type: select, proxies: [💫 随心所欲, 🔯 香港故转, 🔯 日本故转, 🌟 香港自动, 🌸 日本自动, 🌭 美国自动, ⚡ 自动选择, ⚜️ 指尖逸选, 🛳 香港节点, 🗾 日本节点, 🗽 美国节点, 直连]}
mm: &mm {type: select, proxies: [⚡ 自动选择, 🌟 香港自动, 🌸 日本自动, ☕ 狮城自动, 🍍 台湾自动, 🌭 美国自动, ⚜️ 指尖逸选, 🔯 香港故转, 🔯 日本故转, 🔯 狮城故转, 🔯 台湾故转, 🔯 美国故转, 🛳 香港节点, 🗾 日本节点, 🦁 狮城节点, 🧋 台湾节点, 🗽 美国节点, 直连]}
ad: &ad {type: select, include-all: true}
au: &au {type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(直连)).)*$"} # 自动选择


proxy-groups:
  - {name: 💫 随心所欲, !!merge <<: *mm}
  - {name: ⚜️ 指尖逸选, !!merge <<: *ad}
  - {name: ⚡ 自动选择, !!merge <<: *au}
  - {name: 🌟 香港自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(港|HK|(?i)Hong|HKG|香港|🇭🇰))^((?!(台|日|韩|新|深|美|hongxin)).)*$"}
  - {name: 🌸 日本自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(日|JP\\b|(?i)Japan|NRT|HND|KIX|CTS|FUK|🇯🇵))^((?!(港|台|韩|新|深|美)).)*$"}
  - {name: ☕ 狮城自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(狮城|新加坡|(?i)Singapore|SG\\b|SGP|SIN|XSP|🇸🇬))^((?!(港|台|日|韩|美|美利坚|USA|Japan|JP|韩国|香港|台湾)).)*$"}
  - {name: 🍍 台湾自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(台|TW\\b|Taiwan|TPE|KHH|TSA|🇹🇼))^((?!(港|日|韩|新|美)).)*$"}
  - {name: 🌭 美国自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(美|US\\b|(?i)States|USA|United\\s*States|American|JFK|LAX|SFO|🇺🇸))^((?!(港|台|日|韩|新)).)*$"} 
  - {name: 📥 兰台共储, !!merge <<: *pt}
  - {name: 🎬 影库狂潮, !!merge <<: *ay}
  - {name: 🔞 秘密花园, !!merge <<: *av}
  - {name: ❄️ 雪落无声, !!merge <<: *at}
  - {name: 🤯 人工智能, !!merge <<: *aq}
  - {name: 🌏 全球语桥, !!merge <<: *pr}
  - {name: 🍎 果园私语, !!merge <<: *ae}
  - {name: 🎯 绝对通行, !!merge <<: *ae}
  - {name: 🐟 漏网之鱼, !!merge <<: *pr}
  - {name: 🔯 香港故转, type: fallback, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$"}
  - {name: 🔯 日本故转, type: fallback, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$"}
  - {name: 🔯 狮城故转, type: fallback, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(狮城|新加坡|(?i)Singapore|SG\\b|SGP))^((?!(港|台|日|韩|美|美利坚|USA|Japan|JP|韩国|香港|台湾)).)*$"}
  - {name: 🔯 美国故转, type: fallback, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(美|US|(?i)United\\s?States|USA|American))^((?!(港|台|韩|新|日|狮)).)*$"}
  - {name: 🔯 台湾故转, type: fallback, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(台|TW|Taiwan|TPE|KHH|TSA))^((?!(港|日|韩|新|美)).)*$"}
  - {name: 🛳 香港节点, type: select, include-all: true, filter: "(?i)港|香港|HK|HKG|hong\\s*kong|xianggang|heung\\s*gong|🇭🇰"}
  - {name: 🗾 日本节点, type: select, include-all: true, filter: "(?i)日本|日|JP\\b|Japan|NRT|HND|KIX|CTS|FUK|🇯🇵|nihon|nippon"}
  - {name: 🦁 狮城节点, type: select, include-all: true, filter: "(?i)狮城|新加坡|SG\\b|Sing|Singapore|SIN|XSP|xinjiapo|🇸🇬"}
  - {name: 🧋 台湾节点, type: select, include-all: true, filter: "(?i)台湾|台灣|台|TW\\b|TPE|TSA|KHH|taiwan|tai\\s*wan|🇹🇼"}
  - {name: 🗽 美国节点, type: select, include-all: true, filter: "(?i)美国|美|US\\b|USA\\b|United\\s*States|UnitedStates|America|American|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD|🇺🇸|mei\\s*guo"}
